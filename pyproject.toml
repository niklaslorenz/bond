[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bond"
version = "0.1.0"
description = "An AI Agent with many personas"
authors = [{ name = "Niklas Lorenz", email = "niklaslorenz1999@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12.3"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "ddgs>=9.11.4",
    "pydantic>=2.12.5",
    "requests>=2.32.5",
    "returns>=0.26.0",
    "urllib3>=2.6.3",
    "textual>=8.2.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "black>=26.5.1",
    "isort>=8.0.1",
]

[project.urls]
"Homepage" = "https://github.com/niklaslorenz/bond"
"Bug Tracker" = "https://github.com/niklaslorenz/bond/issues"

[project.scripts]
bond = "bond.cli.bond:main"
ask = "bond.cli.ask:main"
followup = "bond.cli.followup:main"
chat = "bond.cli.chat:main"
talk = "bond.tui.main:main"

[project.entry-points."bond.plugins"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.basedpyright]
include = ["src"]
exclude = ["**/__pycache__", ".venv"]
typeCheckingMode = "basic"
venvPath = "."
venv=".venv"
extraPaths = ["src"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88
